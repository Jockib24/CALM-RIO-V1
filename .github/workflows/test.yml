name: CI

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: calmrio_test
          POSTGRES_USER: calmrio
          POSTGRES_PASSWORD: calmrio_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install django-test-migrations

      - name: Run migrations
        run: |
          python manage.py migrate --settings=config.settings.local
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DJANGO_DEBUG: "False"

      - name: Run tests
        run: |
          python manage.py test apps.properties.tests apps.pages.tests apps.home.tests --settings=config.settings.local --verbosity=2
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DJANGO_DEBUG: "False"

      - name: Check for unapplied migrations
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings.local
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DJANGO_DEBUG: "False"
