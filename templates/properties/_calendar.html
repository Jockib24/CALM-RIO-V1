{% load i18n %}
{% load static %}

<div class="cr-calendar" id="availabilityCalendar">
    <div class="cr-cal__header">
        <div class="cr-cal__header-info">
            <div class="cr-cal__header-icon">
                <i class="fas fa-calendar-alt"></i>
            </div>
            <div>
                <h4 class="cr-cal__title">{% trans "Disponibilités" %}</h4>
                <p class="cr-cal__subtitle">{% trans "Calendrier mis à jour en temps réel" %}</p>
            </div>
        </div>
        <div class="cr-cal__legend">
            <span class="cr-cal__legend-item">
                <span class="cr-cal__dot cr-cal__dot--available"></span>
                {% trans "Libre" %}
            </span>
            <span class="cr-cal__legend-item">
                <span class="cr-cal__dot cr-cal__dot--booked"></span>
                {% trans "Réservé" %}
            </span>
            <span class="cr-cal__legend-item">
                <span class="cr-cal__dot cr-cal__dot--past"></span>
                {% trans "Passé" %}
            </span>
        </div>
    </div>

    <div class="cr-cal__grid" id="calGrid">
        <div class="cr-cal__loading" id="calLoading">
            <div class="cr-cal__loading-spinner"></div>
            <span>{% trans "Chargement du calendrier…" %}</span>
        </div>
    </div>
</div>

<style>
/* ═══════════════════════════════════════════
   CalmRio Availability Calendar — Redesigned
   ═══════════════════════════════════════════ */

/* ── Root Variables (scope to calendar) ── */
.cr-calendar {
    --cr-navy: #1B3A4B;
    --cr-navy-light: #234b5e;
    --cr-gold: #C49A5A;
    --cr-gold-light: rgba(196, 154, 90, 0.12);
    --cr-gold-medium: rgba(196, 154, 90, 0.25);
    --cr-cream: #F6F3EE;
    --cr-text: #4a5568;
    --cr-text-light: #9ca3af;
    --cr-border: #e8e4de;
    --cr-white: #ffffff;
    --cr-shadow: 0 8px 36px rgba(27, 58, 75, 0.08);
    --cr-radius: 18px;
    --cr-radius-sm: 10px;
}

/* ── Container ── */
.cr-calendar {
    margin-top: 60px;
    background: var(--cr-white);
    border-radius: var(--cr-radius);
    box-shadow: var(--cr-shadow);
    overflow: hidden;
    border: 1px solid var(--cr-border);
}

/* ── Header ── */
.cr-cal__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    padding: 30px 36px 24px;
    background: var(--cr-navy);
    color: var(--cr-white);
    position: relative;
    overflow: hidden;
}
.cr-cal__header::after {
    content: '';
    position: absolute;
    top: -60%;
    right: -10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
    pointer-events: none;
}
.cr-cal__header-info {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
}
.cr-cal__header-icon {
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: var(--cr-gold);
    flex-shrink: 0;
}
.cr-cal__title {
    margin: 0 0 2px;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    font-family: 'Playfair Display', serif;
}
.cr-cal__subtitle {
    margin: 0;
    font-size: 0.82rem;
    opacity: 0.7;
    font-weight: 400;
}

/* ── Legend ── */
.cr-cal__legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
}
.cr-cal__legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0.85;
    letter-spacing: 0.2px;
}
.cr-cal__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
}
.cr-cal__dot--available { background: var(--cr-gold); }
.cr-cal__dot--booked    { background: var(--cr-white); opacity: 0.9; }
.cr-cal__dot--past      { background: rgba(255,255,255,0.3); }

/* ── Grid ── */
.cr-cal__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    padding: 10px;
    background: #faf9f7;
}
@media (max-width: 992px) {
    .cr-cal__grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 576px) {
    .cr-cal__grid { grid-template-columns: 1fr; padding: 6px; }
    .cr-cal__header { padding: 22px 20px 18px; flex-direction: column; align-items: flex-start; }
}

/* ── Month Card ── */
.cr-cal__month {
    background: var(--cr-white);
    border-radius: 14px;
    overflow: hidden;
    margin: 6px;
    border: 1px solid var(--cr-border);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
    opacity: 0;
    transform: translateY(12px);
    animation: crCalFadeIn 0.5s ease forwards;
}
.cr-cal__month:hover {
    box-shadow: 0 8px 28px rgba(27,58,75,0.08);
    transform: translateY(-3px);
}

/* Staggered animation for months */
.cr-cal__month:nth-child(1) { animation-delay: 0.0s; }
.cr-cal__month:nth-child(2) { animation-delay: 0.08s; }
.cr-cal__month:nth-child(3) { animation-delay: 0.16s; }
.cr-cal__month:nth-child(4) { animation-delay: 0.24s; }
.cr-cal__month:nth-child(5) { animation-delay: 0.32s; }
.cr-cal__month:nth-child(6) { animation-delay: 0.40s; }

@keyframes crCalFadeIn {
    to { opacity: 1; transform: translateY(0); }
}

/* ── Month Title ── */
.cr-cal__month-title {
    text-align: center;
    padding: 16px 10px 12px;
    background: var(--cr-cream);
    border-bottom: 1px solid var(--cr-border);
}
.cr-cal__month-title span {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--cr-navy);
    letter-spacing: 0.2px;
    font-family: 'Playfair Display', serif;
}

/* ── Day Grid (CSS Grid replacing HTML table) ── */
.cr-cal__days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 6px 8px 10px;
    gap: 2px;
}

/* ── Day Header Labels ── */
.cr-cal__day-label {
    text-align: center;
    padding: 10px 0 6px;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--cr-text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* ── Day Cell ── */
.cr-cal__day {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--cr-text);
    border-radius: var(--cr-radius-sm);
    cursor: default;
    transition: all 0.15s ease;
    position: relative;
}

/* ── States ── */
.cr-cal__day--available {
    color: var(--cr-navy);
    background: var(--cr-gold-light);
    cursor: pointer;
}
.cr-cal__day--available:hover {
    background: var(--cr-gold-medium);
    transform: scale(1.08);
}

.cr-cal__day--booked {
    color: var(--cr-white);
    background: var(--cr-navy);
    font-weight: 600;
}
.cr-cal__day--booked:hover {
    background: var(--cr-navy-light);
}

.cr-cal__day--past {
    color: #d1d5db;
    background: transparent;
}

.cr-cal__day--today {
    color: var(--cr-white);
    background: var(--cr-gold);
    font-weight: 700;
    box-shadow: 0 3px 10px rgba(196, 154, 90, 0.35);
}
.cr-cal__day--today:hover {
    background: #b8894a;
    transform: scale(1.08);
}

.cr-cal__day--empty {
    background: transparent;
    cursor: default;
}

/* ── Loading ── */
.cr-cal__loading {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    gap: 16px;
    color: var(--cr-text-light);
    font-size: 0.9rem;
}
.cr-cal__loading-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--cr-border);
    border-top-color: var(--cr-gold);
    border-radius: 50%;
    animation: crCalSpin 0.7s linear infinite;
}
@keyframes crCalSpin {
    to { transform: rotate(360deg); }
}

/* ── Check-in / Check-out markers ── */
.cr-cal__day--check-in,
.cr-cal__day--check-out {
    position: relative;
}
.cr-cal__day--check-in::after,
.cr-cal__day--check-out::after {
    content: '';
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    bottom: 3px;
}
.cr-cal__day--check-in::after {
    background: #22c55e;
    right: 3px;
}
.cr-cal__day--check-out::after {
    background: #ef4444;
    left: 3px;
}

/* Responsive day sizing */
@media (max-width: 576px) {
    .cr-cal__day { font-size: 0.78rem; }
    .cr-cal__day-label { font-size: 0.6rem; }
}

/* Print-friendly */
@media print {
    .cr-calendar { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
    .cr-cal__header { background: #1B3A4B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cr-cal__day--booked, .cr-cal__day--today { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<script>
(function() {
    var bookedRanges = {{ booked_dates_json|safe }};
    var calGrid = document.getElementById('calGrid');
    var calLoading = document.getElementById('calLoading');

    function isBooked(day, month, year) {
        var d = new Date(year, month, day);
        var ts = d.getTime();
        for (var i = 0; i < bookedRanges.length; i++) {
            var start = new Date(bookedRanges[i].start);
            var end = new Date(bookedRanges[i].end);
            if (ts >= start.getTime() && ts < end.getTime()) {
                return true;
            }
        }
        return false;
    }

    function renderMonth(month, year) {
        var monthNames = [
            'Janvier','Février','Mars','Avril','Mai','Juin',
            'Juillet','Août','Septembre','Octobre','Novembre','Décembre'
        ];
        var dayLabels = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
        var today = new Date();
        today.setHours(0,0,0,0);

        var firstDay = new Date(year, month, 1);
        var lastDay = new Date(year, month + 1, 0);
        var startDow = firstDay.getDay();
        startDow = (startDow === 0) ? 6 : startDow - 1; // Monday=0
        var totalDays = lastDay.getDate();

        var html = '<div class="cr-cal__month">';
        html += '<div class="cr-cal__month-title"><span>' + monthNames[month] + ' ' + year + '</span></div>';

        // Day labels row
        html += '<div class="cr-cal__days">';
        for (var d = 0; d < 7; d++) {
            html += '<div class="cr-cal__day-label">' + dayLabels[d] + '</div>';
        }

        // Empty cells before first day
        for (var i = 0; i < startDow; i++) {
            html += '<div class="cr-cal__day cr-cal__day--empty"></div>';
        }

        // Day cells
        var day = 1;
        while (day <= totalDays) {
            var dateObj = new Date(year, month, day);
            dateObj.setHours(0,0,0,0);
            var classNames = 'cr-cal__day';

            if (dateObj < today) {
                classNames += ' cr-cal__day--past';
            } else if (dateObj.getTime() === today.getTime()) {
                classNames += ' cr-cal__day--today';
            } else if (isBooked(day, month, year)) {
                classNames += ' cr-cal__day--booked';
            } else {
                classNames += ' cr-cal__day--available';
            }

            html += '<div class="' + classNames + '">' + day + '</div>';
            day++;
        }

        // Fill remaining cells
        var totalCells = startDow + totalDays;
        var remainder = totalCells % 7;
        if (remainder > 0) {
            for (var r = 0; r < (7 - remainder); r++) {
                html += '<div class="cr-cal__day cr-cal__day--empty"></div>';
            }
        }

        html += '</div></div>'; // close .cr-cal__days + .cr-cal__month
        return html;
    }

    // Render 6 months starting from current
    var now = new Date();
    var currentMonth = now.getMonth();
    var currentYear = now.getFullYear();

    var html = '';
    for (var m = 0; m < 6; m++) {
        var month = (currentMonth + m) % 12;
        var year = currentYear + Math.floor((currentMonth + m) / 12);
        html += renderMonth(month, year);
    }

    calGrid.innerHTML = html;
    if (calLoading) calLoading.style.display = 'none';
})();
</script>
