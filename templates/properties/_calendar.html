{% load i18n %}
<div class="availability-calendar" id="availabilityCalendar">
    <div class="cal-header">
        <div class="cal-header-left">
            <h4><i class="fas fa-calendar-alt"></i> {% trans "Disponibilités" %}</h4>
            <p>{% trans "Consultez les dates disponibles pour votre séjour" %}</p>
        </div>
        <div class="cal-legend">
            <span class="cal-legend-item"><span class="cal-dot available"></span> {% trans "Disponible" %}</span>
            <span class="cal-legend-item"><span class="cal-dot booked"></span> {% trans "Réservé" %}</span>
            <span class="cal-legend-item"><span class="cal-dot past"></span> {% trans "Passé" %}</span>
        </div>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div id="calLoading" class="cal-loading">
        <i class="fas fa-spinner fa-spin"></i> {% trans "Chargement…" %}
    </div>
</div>

<style>
/* ── Calendar Container ── */
.availability-calendar {
    margin-top: 50px;
    padding: 0;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.06);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.04);
}

/* ── Header ── */
.cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 28px 32px 20px;
    background: linear-gradient(135deg, var(--primary-color, #1B3A4B) 0%, #234b5e 100%);
    color: #fff;
}
.cal-header h4 {
    margin: 0 0 4px;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.3px;
}
.cal-header h4 i {
    margin-right: 10px;
    opacity: 0.85;
}
.cal-header p {
    margin: 0;
    font-size: 0.88rem;
    opacity: 0.75;
}

/* ── Legend ── */
.cal-legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}
.cal-legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    font-weight: 500;
    opacity: 0.9;
}
.cal-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}
.cal-dot.available { background: #22c55e; }
.cal-dot.booked    { background: #ef4444; }
.cal-dot.past      { background: #d1d5db; }

/* ── Grid ── */
.cal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    padding: 8px;
}
@media (max-width: 992px) {
    .cal-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 576px) {
    .cal-grid { grid-template-columns: 1fr; }
    .cal-header { padding: 20px 18px 16px; flex-direction: column; align-items: flex-start; }
}

/* ── Month Card ── */
.cal-month {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #f0f0f0;
    transition: box-shadow 0.25s ease, transform 0.25s ease;
}
.cal-month:hover {
    box-shadow: 0 6px 24px rgba(0,0,0,0.07);
    transform: translateY(-2px);
}

/* ── Month Title ── */
.cal-month-title {
    text-align: center;
    padding: 14px 10px 10px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--primary-color, #1B3A4B);
    letter-spacing: 0.3px;
    text-transform: capitalize;
    background: #fafbfc;
    border-bottom: 1px solid #f0f0f0;
}

/* ── Day Headers ── */
.cal-month table {
    width: 100%;
    border-collapse: collapse;
}
.cal-month th {
    padding: 8px 0 5px;
    font-size: 0.7rem;
    font-weight: 700;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    background: transparent;
    border: none;
}

/* ── Day Cells ── */
.cal-month td {
    text-align: center;
    padding: 0;
    font-size: 0.82rem;
    font-weight: 500;
    border: none;
    position: relative;
    vertical-align: middle;
}
.cal-month td .day-inner {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    transition: all 0.15s ease;
}

/* ── States ── */
.cal-month td.available .day-inner {
    color: #16a34a;
    background: rgba(34,197,94,0.06);
}
.cal-month td.available .day-inner:hover {
    background: rgba(34,197,94,0.14);
}
.cal-month td.booked .day-inner {
    color: #fff;
    background: #ef4444;
    font-weight: 700;
}
.cal-month td.booked .day-inner:hover {
    background: #dc2626;
    transform: scale(1.08);
}
.cal-month td.past .day-inner {
    color: #d1d5db;
    background: transparent;
}
.cal-month td.today .day-inner {
    color: var(--primary-color, #1B3A4B);
    background: var(--primary-color, #1B3A4B);
    color: #fff;
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(27,58,75,0.25);
}
.cal-month td.empty {
    background: transparent;
}

/* ── Loading ── */
.cal-loading {
    text-align: center;
    padding: 30px;
    color: #9ca3af;
    font-size: 0.9rem;
}
.cal-loading i {
    margin-right: 8px;
}
</style>

<script>
(function() {
    var bookedRanges = {{ booked_dates_json|safe }};
    var calGrid = document.getElementById('calGrid');
    var calLoading = document.getElementById('calLoading');

    function isBooked(day, month, year) {
        var d = new Date(year, month, day);
        var ts = d.getTime();
        for (var i = 0; i < bookedRanges.length; i++) {
            var start = new Date(bookedRanges[i].start);
            var end = new Date(bookedRanges[i].end);
            if (ts >= start.getTime() && ts < end.getTime()) {
                return true;
            }
        }
        return false;
    }

    function renderMonth(month, year) {
        var monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        var dayNames = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
        var today = new Date();
        today.setHours(0,0,0,0);

        var firstDay = new Date(year, month, 1);
        var lastDay = new Date(year, month + 1, 0);
        var startDow = firstDay.getDay();
        startDow = (startDow === 0) ? 6 : startDow - 1;

        var totalDays = lastDay.getDate();

        var html = '<div class="cal-month">';
        html += '<div class="cal-month-title">' + monthNames[month] + ' ' + year + '</div>';
        html += '<table><thead><tr>';
        for (var d = 0; d < 7; d++) {
            html += '<th>' + dayNames[d] + '</th>';
        }
        html += '</tr></thead><tbody><tr>';

        for (var i = 0; i < startDow; i++) {
            html += '<td class="empty"></td>';
        }

        var day = 1;
        while (day <= totalDays) {
            var dateObj = new Date(year, month, day);
            var classes = '';

            if (dateObj < today) {
                classes = 'past';
            } else if (dateObj.getTime() === today.getTime()) {
                classes = 'today';
            } else if (isBooked(day, month, year)) {
                classes = 'booked';
            } else {
                classes = 'available';
            }

            html += '<td class="' + classes + '"><span class="day-inner">' + day + '</span></td>';

            var dow = (startDow + day) % 7;
            if (dow === 6 && day < totalDays) {
                html += '</tr><tr>';
            }
            day++;
        }

        // Fill remaining cells in last row
        var lastDow = (startDow + totalDays) % 7;
        if (lastDow !== 0) {
            for (var r = lastDow; r < 7; r++) {
                html += '<td class="empty"></td>';
            }
        }

        html += '</tr></tbody></table></div>';
        return html;
    }

    var now = new Date();
    var currentMonth = now.getMonth();
    var currentYear = now.getFullYear();

    var html = '';
    for (var m = 0; m < 6; m++) {
        var month = (currentMonth + m) % 12;
        var year = currentYear + Math.floor((currentMonth + m) / 12);
        html += renderMonth(month, year);
    }

    calGrid.innerHTML = html;
    if (calLoading) calLoading.style.display = 'none';
})();
</script>
