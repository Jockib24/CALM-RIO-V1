{% extends "dashboard/base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}

<div style="margin-bottom:24px;">
  <a href="{% url 'dashboard:season_list' %}" style="color:var(--db-text-light);text-decoration:none;font-size:0.9rem;">
    <i class="fas fa-arrow-left"></i> Retour aux saisons
  </a>
</div>

<form method="post" class="db-form">
  {% csrf_token %}
  <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:24px;">{{ title }}</h2>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
    <div>
      <label for="id_unit">Propriété</label>
      <select name="unit" id="id_unit" required>
        {% for prop in form.unit.field.queryset %}
        <option value="{{ prop.pk }}" {% if form.unit.value|stringformat:'s' == prop.pk|stringformat:'s' %}selected{% endif %}>{{ prop.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="id_name">Nom de la saison</label>
      <input type="text" name="name" id="id_name" value="{{ form.name.value|default:'' }}" placeholder="ex: Haute saison, Pont de mai..." required>
    </div>
    <div>
      <label for="id_start_date">Date de début</label>
      <input type="date" name="start_date" id="id_start_date" value="{{ form.start_date.value|date:'Y-m-d'|default:'' }}" required>
    </div>
    <div>
      <label for="id_end_date">Date de fin</label>
      <input type="date" name="end_date" id="id_end_date" value="{{ form.end_date.value|date:'Y-m-d'|default:'' }}" required>
    </div>
    <div>
      <label for="id_nightly_price">Prix par nuit (€)</label>
      <input type="number" step="0.01" name="nightly_price" id="id_nightly_price" value="{{ form.nightly_price.value|default:'' }}" placeholder="Laissez vide pour prix de base">
    </div>
    <div>
      <label for="id_order">Ordre</label>
      <input type="number" name="order" id="id_order" value="{{ form.order.value|default:'0' }}">
    </div>
  </div>

  <div style="display:flex;gap:10px;margin-top:24px;">
    <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Enregistrer</button>
    <a href="{% url 'dashboard:season_list' %}" class="btn btn-outline">Annuler</a>
  </div>
</form>

{% endblock %}
