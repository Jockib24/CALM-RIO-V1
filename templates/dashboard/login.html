{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — CalmRio Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'fonts/fontawesome/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/plugins/bootstrap.min.css' %}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .login-card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1B3A4B;
    }
    .login-card h1 span { color: #C49A5A; }
    .login-card p { color: #718096; font-size: 0.9rem; margin-bottom: 32px; }
    .login-card form input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .login-card form input:focus {
      outline: none;
      border-color: #C49A5A;
      box-shadow: 0 0 0 3px rgba(196,154,90,0.15);
    }
    .login-card form button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1B3A4B;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-card form button:hover { background: #122a36; }
    .login-card .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .login-card .back-link {
      display: block;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #718096;
      text-decoration: none;
    }
    .login-card .back-link:hover { color: #1B3A4B; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Calm<span>Rio</span></h1>
    <p>Tableau de bord — Connexion</p>
    {% if form.errors %}
      <div class="error">Identifiants incorrects. Veuillez réessayer.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Nom d'utilisateur" required autofocus>
      <input type="password" name="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Retour au site</a>
  </div>
</body>
</html>
