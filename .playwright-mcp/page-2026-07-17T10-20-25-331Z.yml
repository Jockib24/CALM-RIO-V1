          - heading "Entre mer et forêt" [level=3] [ref=f1e549]
          - paragraph [ref=f1e550]: Imaginez-vous pédaler à travers la forêt domaniale de Saint-Trojan, l'odeur des pins maritimes mêlée aux embruns de l'Atlantique. L'île d'Oléron est un paradis pour les cyclistes, avec plus de 130 km de pistes cyclables qui serpentent entre marais salants, parcs ostréicoles et plages sauvages.
          - paragraph [ref=f1e551]: À Royan, la Grande Conche déroule ses 2,6 km de sable fin à 100 mètres de notre appartement. Les célèbres huîtres de Marennes-Oléron et le pineau des Charentes n'attendent que vous au marché couvert.
